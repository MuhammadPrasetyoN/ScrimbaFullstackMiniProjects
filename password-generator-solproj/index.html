<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="index.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Happy+Monkey&family=Karla:ital,wght@0,200..800;1,200..800&family=Orbitron:wght@400..900&display=swap"
      rel="stylesheet"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Generator🔑</title>
  </head>
  <body>
    <div class="container">
      <h1 class="title">
        Generate a <br /><span class="highlight">Secure Random Password</span>
      </h1>
      <p class="description">Never use an insecure password again.</p>
      <div class="controls">
        <label class="control-row">
          <span class="control-label">Password length</span>
          <input
            id="password-length"
            class="length-input"
            type="number"
            min="8"
            max="24"
            value="15"
          />
        </label>

        <div class="toggle-group" aria-label="Password options">
          <label class="option">
            <input id="include-numbers" type="checkbox" checked />
            <span>Include numbers</span>
          </label>
          <label class="option">
            <input id="include-symbols" type="checkbox" checked />
            <span>Include symbols</span>
          </label>
        </div>
      </div>

      <button id="generate-btn" class="gen-btn">
        Generate Passwords
      </button>
      <p id="status-message" class="status" aria-live="polite"></p>
      <hr class="divider" />
      <div class="passwords-container">
        <div id="password-one" class="password-box"></div>
        <div id="password-two" class="password-box"></div>
      </div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
