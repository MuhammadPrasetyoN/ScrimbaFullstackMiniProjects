<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="index.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Happy+Monkey&family=Karla:ital,wght@0,200..800;1,200..800&family=Orbitron:wght@400..900&display=swap"
      rel="stylesheet"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Generator🔑</title>
  </head>
  <body>
    <div class="container">
      <h1 class="title">
        Generate a <br /><span class="highlight">Secure Random Password</span>
      </h1>
      <p class="description">Never use an insecure password again.</p>
      <button class="gen-btn" onclick="generatePasswords()">
        Generate Passwords
      </button>
      <hr class="divider" />
      <div class="passwords-container">
        <div id="password-one" class="password-box"></div>
        <div id="password-two" class="password-box"></div>
      </div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
